<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mini Coding Agent</title>
<style>
  :root {
    --bg: #0d1117;
    --panel: #161b22;
    --panel-2: #1c2129;
    --border: #30363d;
    --text: #e6edf3;
    --text-dim: #8b949e;
    --accent: #4f8cff;
    --accent-2: #9b6bff;
    --ok: #3fb950;
    --warn: #d29922;
    --danger: #f85149;
    --mono: "Cascadia Code", "JetBrains Mono", Consolas, "Courier New", monospace;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    display: flex; flex-direction: column;
    font-size: 14px;
  }
  /* ---------- header ---------- */
  header {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 20px; border-bottom: 1px solid var(--border);
    background: var(--panel); flex-shrink: 0;
  }
  header .logo {
    width: 30px; height: 30px; border-radius: 8px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 15px; color: #fff;
  }
  header h1 { font-size: 15px; font-weight: 600; }
  header .sub { color: var(--text-dim); font-size: 12px; }
  .spacer { flex: 1; }
  #status-dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: var(--text-dim); transition: all .3s;
  }
  #status-dot.running { background: var(--accent); box-shadow: 0 0 8px var(--accent); animation: pulse 1.2s infinite; }
  #status-dot.waiting { background: var(--warn); box-shadow: 0 0 8px var(--warn); }
  #status-dot.done { background: var(--ok); }
  #status-dot.error { background: var(--danger); }
  @keyframes pulse { 50% { opacity: .4; } }
  #model-tag {
    font-size: 11px; color: var(--text-dim); border: 1px solid var(--border);
    padding: 3px 8px; border-radius: 20px; font-family: var(--mono);
  }
  /* ---------- messages ---------- */
  main { flex: 1; overflow-y: auto; padding: 24px 20px 12px; scroll-behavior: smooth; }
  .msg { max-width: 860px; margin: 0 auto 16px; }
  .bubble {
    padding: 10px 14px; border-radius: 12px; line-height: 1.7;
    white-space: pre-wrap; word-break: break-word;
  }
  .msg.user .bubble {
    background: #1f3a5f; border: 1px solid #2b5278; margin-left: auto;
  }
  .msg.user { display: flex; justify-content: flex-end; }
  .msg.assistant .bubble { background: var(--panel); border: 1px solid var(--border); }
  .msg .meta { font-size: 11px; color: var(--text-dim); margin-bottom: 4px; }
  .msg.user .meta { text-align: right; }
  /* ---------- tool cards ---------- */
  .tool-card {
    margin: 8px auto 0; max-width: 860px;
    border: 1px solid var(--border); border-radius: 10px; overflow: hidden;
    background: var(--panel-2);
  }
  .tool-head {
    display: flex; align-items: center; gap: 8px;
    padding: 7px 12px; cursor: pointer; user-select: none;
    border-bottom: 1px solid var(--border);
  }
  .tool-head .name { font-family: var(--mono); font-size: 12px; color: var(--accent); font-weight: 600; }
  .tool-head .args {
    font-family: var(--mono); font-size: 11px; color: var(--text-dim);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1;
  }
  .tool-head .badge { font-size: 10px; padding: 1px 7px; border-radius: 10px; flex-shrink: 0; }
  .badge.ok { background: rgba(63,185,80,.15); color: var(--ok); }
  .badge.approved { background: rgba(63,185,80,.15); color: var(--ok); }
  .badge.denied { background: rgba(248,81,73,.15); color: var(--danger); }
  .badge.error { background: rgba(248,81,73,.15); color: var(--danger); }
  .badge.waiting { background: rgba(210,153,34,.15); color: var(--warn); }
  .tool-body {
    padding: 10px 12px; font-family: var(--mono); font-size: 12px;
    white-space: pre-wrap; word-break: break-all; max-height: 420px; overflow: auto;
    color: #c9d1d9; display: none;
  }
  .tool-card.open .tool-body { display: block; }
  .tool-head .arrow { color: var(--text-dim); font-size: 10px; transition: transform .2s; }
  .tool-card.open .arrow { transform: rotate(90deg); }
  /* ---------- pending panel ---------- */
  #pending-panel {
    max-width: 860px; margin: 0 auto 12px; padding: 14px 16px;
    border: 1px solid var(--warn); border-radius: 12px;
    background: rgba(210,153,34,.08); display: none;
  }
  #pending-panel.show { display: block; }
  #pending-panel .title { font-size: 13px; font-weight: 600; color: var(--warn); margin-bottom: 6px; }
  #pending-panel .p-command {
    font-family: var(--mono); font-size: 12px; background: #12181f;
    border: 1px solid var(--border); border-radius: 8px; padding: 10px; margin-bottom: 10px;
    word-break: break-all;
  }
  #pending-panel .p-question { font-size: 13px; margin-bottom: 10px; }
  #pending-panel input[type=text] {
    width: 100%; background: #12181f; border: 1px solid var(--border); color: var(--text);
    padding: 8px 12px; border-radius: 8px; font-size: 13px; outline: none;
  }
  #pending-panel input[type=text]:focus { border-color: var(--accent); }
  .btn-row { display: flex; gap: 8px; margin-top: 10px; }
  .btn {
    padding: 6px 16px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--panel-2); color: var(--text); cursor: pointer; font-size: 13px;
    transition: all .15s;
  }
  .btn:hover { border-color: var(--accent); }
  .btn.primary { background: var(--danger); color: #fff; border-color: transparent; }
  .btn.primary:hover { filter: brightness(1.1); }
  .btn.allow { background: var(--ok); color: #fff; border-color: transparent; }
  .btn.allow:hover { filter: brightness(1.1); }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  /* ---------- typing ---------- */
  .typing { display: inline-flex; gap: 4px; padding: 4px 0; }
  .typing i { width: 6px; height: 6px; border-radius: 50%; background: var(--text-dim); animation: blink 1.2s infinite; }
  .typing i:nth-child(2) { animation-delay: .2s; }
  .typing i:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 50% { opacity: .2; } }
  /* ---------- input ---------- */
  footer { border-top: 1px solid var(--border); padding: 12px 20px; background: var(--panel); flex-shrink: 0; }
  .input-row { max-width: 860px; margin: 0 auto; display: flex; gap: 10px; }
  #input {
    flex: 1; background: var(--panel-2); border: 1px solid var(--border); color: var(--text);
    border-radius: 10px; padding: 12px 14px; font-size: 14px; resize: none; outline: none;
    font-family: inherit; min-height: 46px; max-height: 140px;
  }
  #input:focus { border-color: var(--accent); }
  #send {
    padding: 0 22px; border: none; border-radius: 10px; cursor: pointer; font-size: 14px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #fff; font-weight: 600;
  }
  #send:disabled { opacity: .4; cursor: not-allowed; }
  .hint { max-width: 860px; margin: 8px auto 0; font-size: 11px; color: var(--text-dim); }
  code { font-family: var(--mono); background: var(--panel-2); padding: 1px 5px; border-radius: 4px; }
</style>
</head>
<body>

<header>
  <div class="logo">MC</div>
  <div>
    <h1>Mini Coding Agent</h1>
    <div class="sub" id="sub-info">连接中…</div>
  </div>
  <div class="spacer"></div>
  <span id="model-tag">…</span>
  <div id="status-dot" title="状态"></div>
</header>

<main id="messages">
  <div class="msg assistant">
    <div class="meta">agent · 现在</div>
    <div class="bubble">你好，我是极简 Coding Agent 🛠️ 我可以读写文件、执行 shell 命令、按需求写脚本。
可以试试：
• <code>总结一下工作区里有什么</code>
• <code>帮我创建一个 Python 脚本</code>
• <code>运行我写的脚本</code>
• <code>测试审批（触发危险命令拦截）</code>
• <code>问我一个问题</code></div>
  </div>
</main>

<div id="pending-panel"></div>

<footer>
  <div class="input-row">
    <textarea id="input" rows="1" placeholder="给 Agent 下达任务，Enter 发送，Shift+Enter 换行"></textarea>
    <button id="send">发送</button>
  </div>
  <div class="hint">文件操作被限制在沙箱工作区 <code>workspace/</code> 内 · 危险命令需你批准后才执行</div>
</footer>

<script>
const $ = (s) => document.querySelector(s);
const messagesEl = $("#messages");
const pendingPanel = $("#pending-panel");
const statusDot = $("#status-dot");
let sessionId = null;
let connected = false;
let pendingItems = {};   // pid -> {type, el, resolved}
let toolCards = {};      // tool_call_id -> card element
let busy = false;

const esc = (s) => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const fmt = (s) => String(s).replace(/`([^`]+)`/g, "<code>$1</code>");

/* ---------- SSE ---------- */
async function connectSSE() {
  const evtSource = new EventSource(`/api/events${sessionId ? "?session_id=" + sessionId : ""}`);
  evtSource.onmessage = (e) => {
    const ev = JSON.parse(e.data);
    handleEvent(ev.event, ev.data);
  };
  evtSource.onerror = () => { connected = false; statusDot.className = "error"; };
}
function handleEvent(type, data) {
  switch (type) {
    case "status": setStatus(data.state); break;
    case "message": addMessage(data.role, data.content); break;
    case "tool_call": addToolCard(data); break;
    case "tool_result": fillToolResult(data); break;
    case "approval_request": showApproval(data); break;
    case "ask_request": showAsk(data); break;
    case "error": addMessage("assistant", "⚠️ " + data.message); setStatus("error"); break;
    case "done": busy = false; refreshSend(); break;
  }
}
function setStatus(s) { statusDot.className = s; }
function refreshSend() {
  $("#send").disabled = busy || !$("#input").value.trim();
}

/* ---------- messages ---------- */
function addMessage(role, content) {
  const el = document.createElement("div");
  el.className = "msg " + role;
  const t = new Date().toLocaleTimeString("zh-CN", {hour:"2-digit", minute:"2-digit"});
  el.innerHTML = `<div class="meta">${role === "user" ? "你" : "agent"} · ${t}</div><div class="bubble">${fmt(esc(content))}</div>`;
  messagesEl.appendChild(el);
  scrollBottom();
  if (role === "assistant") killTyping();
}
function addTyping() {
  killTyping();
  const el = document.createElement("div");
  el.className = "msg assistant typing-wrap";
  el.innerHTML = `<div class="typing"><i></i><i></i><i></i></div>`;
  el.id = "typing";
  messagesEl.appendChild(el);
  scrollBottom();
}
function killTyping() { const t = $("#typing"); if (t) t.remove(); }
function scrollBottom() { messagesEl.scrollTop = messagesEl.scrollHeight; }

/* ---------- tool cards ---------- */
function addToolCard(data) {
  let args = "";
  try { args = JSON.stringify(JSON.parse(data.arguments), null, 1); } catch { args = data.arguments; }
  const card = document.createElement("div");
  card.className = "tool-card";
  card.innerHTML = `
    <div class="tool-head">
      <span class="arrow">▶</span>
      <span class="name">${esc(data.name)}</span>
      <span class="args">${esc(args.replace(/\n/g, " ").slice(0, 160))}</span>
      <span class="badge waiting" id="badge-${data.tool_call_id}">执行中…</span>
    </div>
    <div class="tool-body" id="body-${data.tool_call_id}"></div>`;
  card.querySelector(".tool-head").onclick = () => card.classList.toggle("open");
  messagesEl.appendChild(card);
  toolCards[data.tool_call_id] = card;
  scrollBottom();
}
function fillToolResult(data) {
  const card = toolCards[data.tool_call_id];
  if (!card) return;
  const badge = card.querySelector(".badge");
  badge.className = "badge " + data.status;
  const labels = { ok: "完成", approved: "已批准", denied: "已拒绝", error: "出错" };
  badge.textContent = labels[data.status] || data.status;
  card.querySelector(".tool-body").textContent = data.output;
  card.classList.add("open");
  scrollBottom();
}

/* ---------- pending: approval ---------- */
function showApproval(data) {
  const box = document.createElement("div");
  box.className = "msg assistant";
  box.innerHTML = `
    <div class="meta">agent · 权限请求</div>
    <div class="bubble">⚠️ Agent 想执行一条<b style="color:var(--danger)">危险命令</b>，需要你批准后才执行：
      <div class="tool-body" style="display:block;margin-top:8px;background:#12181f;border:1px solid var(--border);border-radius:8px;padding:10px;">${esc(data.command)}</div>
    </div>`;
  const row = document.createElement("div");
  row.style.cssText = "display:flex;gap:8px;margin-top:10px;justify-content:flex-end";
  row.innerHTML = `<button class="btn deny">拒绝</button><button class="btn allow">允许执行</button>`;
  box.querySelector(".bubble").appendChild(row);
  messagesEl.appendChild(box);
  pendingItems[data.pid] = { type: "approval", el: box, resolved: false };
  row.querySelector(".deny").onclick = () => resolvePending(data.pid, { approved: false });
  row.querySelector(".allow").onclick = () => resolvePending(data.pid, { approved: true });
  setStatus("waiting");
  scrollBottom();
}

/* ---------- pending: ask_user ---------- */
function showAsk(data) {
  const box = document.createElement("div");
  box.className = "msg assistant";
  box.innerHTML = `
    <div class="meta">agent · 向你提问</div>
    <div class="bubble">❓ ${fmt(esc(data.question))}</div>`;
  const row = document.createElement("div");
  row.style.cssText = "display:flex;gap:8px;margin-top:10px";
  row.innerHTML = `<input type="text" placeholder="输入你的回答…" style="flex:1;background:#12181f;border:1px solid var(--border);color:var(--text);padding:8px 12px;border-radius:8px;outline:none;font-size:13px">
    <button class="btn allow">回答</button>`;
  box.querySelector(".bubble").appendChild(row);
  messagesEl.appendChild(box);
  pendingItems[data.pid] = { type: "ask", el: box, resolved: false };
  const input = row.querySelector("input");
  const btn = row.querySelector("button");
  const doAnswer = () => {
    const v = input.value.trim();
    if (!v) return;
    btn.disabled = true;
    resolvePending(data.pid, { answer: v });
  };
  btn.onclick = doAnswer;
  input.onkeydown = (e) => { if (e.key === "Enter") doAnswer(); };
  input.focus();
  setStatus("waiting");
  scrollBottom();
}

async function resolvePending(pid, payload) {
  try {
    await fetch("/api/resolve", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ pid, session_id: sessionId, ...payload }),
    });
    const item = pendingItems[pid];
    if (item) {
      item.resolved = true;
      item.el.querySelectorAll(".btn").forEach(b => b.disabled = true);
    }
  } catch (e) { console.error(e); }
}

/* ---------- send ---------- */
const input = $("#input");
$("#send").onclick = send;
input.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
});
input.addEventListener("input", () => {
  input.style.height = "auto";
  input.style.height = Math.min(input.scrollHeight, 140) + "px";
  refreshSend();
});
async function send() {
  const msg = input.value.trim();
  if (!msg || busy) return;
  input.value = ""; input.style.height = "auto"; refreshSend();
  addMessage("user", msg);
  addTyping();
  busy = true; refreshSend();
  try {
    const r = await fetch("/api/chat", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: msg, session_id: sessionId }),
    });
    const j = await r.json();
    if (r.status === 409) { killTyping(); addMessage("assistant", "⚠️ " + j.error); busy = false; refreshSend(); return; }
    sessionId = j.session_id;
    if (!connected) { connectSSE(); connected = true; }
  } catch (e) {
    killTyping(); addMessage("assistant", "⚠️ 连接失败: " + e.message);
    busy = false; refreshSend();
  }
}

/* ---------- init ---------- */
(async () => {
  try {
    const r = await fetch("/api/info");
    const j = await r.json();
    $("#model-tag").textContent = j.model;
    $("#sub-info").textContent = j.mock
      ? "Mock 模式（未配置 API Key，规则模拟演示）· 沙箱: " + j.workspace
      : "沙箱: " + j.workspace;
  } catch (e) { /* ignore */ }
})();
</script>
</body>
</html>
